[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uecs-hardwares"
version = "0.1.0"
description = "UECS HW communication infrastructure — UniPi daemon, sensor drivers, relay control"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
